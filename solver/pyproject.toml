[project]
name = "ga-timetable-solver"
version = "0.1.0"
description = "Genetic algorithm solver for course timetabling"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
]

[project.scripts]
solver = "solver.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
