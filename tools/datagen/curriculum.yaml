    - [MAT101, Toán rời rạc, 3, THEORY, CS]
    - [SKI101, Kỹ năng học tập, 1, THEORY, POL]
  2:
    - [ENG102, Tiếng Anh 2, 2, THEORY, ENG]
    - [POL101, Triết học Mác - Lênin, 3, THEORY, POL]
  3:
    - [ENG103, Tiếng Anh 3, 2, THEORY, ENG]
    - [POL102, Kinh tế chính trị Mác - Lênin, 2, THEORY, POL]
  4:
    - [ENG104, Tiếng Anh 4, 2, THEORY, ENG]
    - [POL103, Chủ nghĩa xã hội khoa học, 2, THEORY, POL]
  5:
    - [POL104, Tư tưởng Hồ Chí Minh, 2, THEORY, POL]
    - [LAW101, Pháp luật đại cương, 2, THEORY, POL]
  6:
    - [POL105, Lịch sử Đảng Cộng sản Việt Nam, 2, THEORY, POL]
    - [SKI201, Khởi nghiệp, 2, THEORY, POL]

