# Chương trình đào tạo Khoa CNTT (dữ liệu giả, đủ thực tế để GA có việc làm).
#
# Môn học ghi dạng: [mã, tên, tín chỉ, loại phòng]  (+ bộ môn nếu khác mặc định)
# Mỗi ngành, mỗi kỳ = môn chung (common) + môn nhóm ngành (groups) + môn riêng của ngành (majors).
#
# Tổng tín chỉ mỗi kỳ:  kỳ 1: 15 | kỳ 2: 17 | kỳ 3: 17 | kỳ 4: 17 | kỳ 5: 17 | kỳ 6: 15
#   kỳ 1: chung 11 + nhóm 4
#   kỳ 2: chung 5  + nhóm 9  + ngành 3
#   kỳ 3: chung 4  + nhóm 10 + ngành 3
#   kỳ 4: chung 4  + nhóm 6  + ngành 7
#   kỳ 5: chung 4  + nhóm 6  + ngành 7
#   kỳ 6: chung 4  + nhóm 5 (đồ án) + ngành 6

departments:
  CS:  Bộ môn Cơ sở CNTT
  SWE: Bộ môn Công nghệ phần mềm
  DAI: Bộ môn Dữ liệu và Trí tuệ nhân tạo
  INF: Bộ môn Hạ tầng và An ninh mạng
  DES: Bộ môn Thiết kế
  ENG: Bộ môn Ngoại ngữ
  POL: Bộ môn Lý luận chính trị và Kỹ năng

