services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Chạy migration (tương đương `php artisan migrate`):
  #   docker compose run --rm migrate up
  #   docker compose run --rm migrate down 1
  #   docker compose run --rm migrate version
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # Sinh code Go từ SQL (admin/sqlc.yaml đọc schema từ db/migrations):
  #   docker compose run --rm sqlc generate
  #   docker compose run --rm sqlc vet
  sqlc:
    image: sqlc/sqlc:1.31.1
    profiles: ["tools"]
    user: "${UID:-1000}:${GID:-1000}"     # file sinh ra thuộc user của bạn, không phải root
    volumes:
      - .:/src
    working_dir: /src/admin

volumes:
  pgdata:
